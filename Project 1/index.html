<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10152b" />
  <title>Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; color: #f5f6ff; background: #10152b; }
    body::before, body::after { content: ""; position: fixed; z-index: -1; width: 32rem; height: 32rem; border-radius: 50%; filter: blur(100px); opacity: .42; animation: drift 12s ease-in-out infinite alternate; }
    body::before { top: -12rem; left: -8rem; background: #7557ff; }
    body::after { right: -10rem; bottom: -14rem; background: #12c9c3; animation-delay: -5s; }
    .card { width: min(90vw, 680px); padding: clamp(2rem, 7vw, 4.5rem); text-align: center; border: 1px solid rgba(255,255,255,.16); border-radius: 28px; background: rgba(255,255,255,.075); box-shadow: 0 24px 90px rgba(0,0,0,.28); backdrop-filter: blur(18px); animation: appear .8s cubic-bezier(.2,.8,.2,1) both; }
    .spark { display: inline-grid; place-items: center; width: 58px; height: 58px; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,.22); border-radius: 18px; background: linear-gradient(135deg, rgba(144,116,255,.55), rgba(35,214,205,.28)); font-size: 1.65rem; }
    .eyebrow { margin: 0 0 .8rem; color: #b8c4e8; font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 10vw, 5.8rem); line-height: 1; letter-spacing: -.07em; background: linear-gradient(100deg, #fff 15%, #c9c2ff 55%, #8af1e9); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .message { max-width: 34rem; margin: 1.3rem auto 0; color: #c4cbe0; font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.7; }
    .button { display: inline-flex; align-items: center; gap: .65rem; margin-top: 2rem; padding: .9rem 1.25rem; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; color: #fff; background: rgba(255,255,255,.1); font: inherit; font-size: .9rem; font-weight: 650; cursor: pointer; transition: transform .2s, background .2s, border-color .2s; }
    .button:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.45); background: rgba(255,255,255,.17); }
    .button:focus-visible { outline: 3px solid #8af1e9; outline-offset: 4px; }
    .button span { display: inline-block; transition: transform .25s; }
    .button:hover span { transform: rotate(90deg); }
    footer { position: fixed; bottom: 1.5rem; color: rgba(222,228,247,.55); font-size: .75rem; letter-spacing: .08em; }
    nav { position: fixed; top: 1.5rem; right: 1.75rem; display: flex; gap: 1.25rem; }
    nav a { color: #c4cbe0; font-size: .9rem; text-decoration: none; transition: color .2s; }
    nav a:hover, nav a:focus-visible { color: #8af1e9; }
    @keyframes appear { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(3rem, 2rem) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation"><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
  <main class="card">
    <div class="spark" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something to get started</p>
    <h1>Hello, World!</h1>
    <p class="message">A bright new beginning. Your next great idea starts right here.</p>
    <button class="button" type="button" id="helloButton"><span aria-hidden="true">✧</span> Say hello</button>
  </main>
  <footer>MADE WITH A LITTLE SPARK</footer>
  <script>
    document.getElementById('helloButton').addEventListener('click', () => {
      const button = document.getElementById('helloButton');
      button.innerHTML = '<span aria-hidden="true">✦</span> Hello, you!';
    });
  </script>
</body>
</html>
